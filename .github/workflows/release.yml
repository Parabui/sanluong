# Phát hành [TDD 17.1]: tag vMAJOR.MINOR.PATCH (vd. v0.1.0, v0.1.1-rc.1)
#   → chạy lại toàn bộ CI (+ E2E) → build 3 image cùng tag → GHCR private → GitHub Release (changelog + gói triển khai)
#   git tag v0.1.0 && git push origin v0.1.0
# Image: vsn-api, vsn-web (Caddy + worker + web), vsn-backup (pg_dump + GPG + rclone — thêm ở tuần 11, ngoài 2 image của TDD).
# Biến cần đặt ở Settings → Secrets and variables → Actions → Variables: VITE_TURNSTILE_SITE_KEY, VITE_SENTRY_DSN (công khai,
# được nhúng vào bundle). Không có secret nào của server ở đây — server tự giữ .env.
name: release

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # tạo GitHub Release
  packages: write # đẩy GHCR

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - ten: vsn-api
            file: apps/api/Dockerfile
            context: .
          - ten: vsn-web
            file: infra/caddy/Dockerfile
            context: .
          - ten: vsn-backup
            file: infra/backup/Dockerfile
            context: infra/backup
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra tag khớp phiên bản package
        if: matrix.ten == 'vsn-api'
        run: |
          v="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          [ "${tag%%-*}" = "$v" ] || { echo "Tag $GITHUB_REF_NAME không khớp version $v trong package.json"; exit 1; }
      - name: Bắt buộc có site key Turnstile (thiếu → app công nhân không đăng nhập trạm được trên production)
        if: matrix.ten == 'vsn-web'
        env:
          KHOA: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: '[ -n "$KHOA" ] || { echo "::error::Chưa đặt Actions Variable VITE_TURNSTILE_SITE_KEY"; exit 1; }'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tên image (GHCR bắt buộc chữ thường)
        id: ten
        run: echo "anh=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.ten }}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.ten.outputs.anh }}
          build-args: |
            VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY }}
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.ten }}
          cache-to: type=gha,mode=max,scope=${{ matrix.ten }}
      # v0.1.0-rc.1 đã phát hành thiếu site key mà không ai biết (Dockerfile không nhận build-arg) → kiểm trên image thật
      - name: Kiểm tra bundle app công nhân đã nhúng site key Turnstile
        if: matrix.ten == 'vsn-web'
        env:
          ANH: ${{ steps.ten.outputs.anh }}
          KHOA: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: |
          docker pull -q "$ANH"
          docker run --rm --entrypoint sh "$ANH" -c "grep -rqF '$KHOA' /srv/worker/assets" \
            || { echo "::error::Bundle /srv/worker KHÔNG chứa VITE_TURNSTILE_SITE_KEY — kiểm tra ARG trong infra/caddy/Dockerfile"; exit 1; }
          echo "site key có trong bundle app công nhân"

  phat-hanh:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gói triển khai cho server (compose, init DB, deploy.sh, khoi-tao.sh, chuyen-may.sh, RUNBOOK)
        run: |
          mkdir -p goi/infra/backup/khoa
          cp -r infra/compose.prod.yml infra/deploy.sh infra/khoi-tao.sh infra/chuyen-may.sh infra/postgres infra/server infra/dozzle goi/infra/
          cp infra/backup/khoa/README.md goi/infra/backup/khoa/
          cp .env.example goi/
          mkdir -p goi/docs && cp docs/RUNBOOK.md goi/docs/
          tar -czf "vsn-trien-khai-${GITHUB_REF_NAME}.tar.gz" -C goi .
      - name: Ghi chú phát hành từ CHANGELOG.md
        run: |
          muc() { awk -v v="$1" '/^## \[/ { dang = index($0, "[" v "]") > 0; next } dang { print }' CHANGELOG.md; }
          v="${GITHUB_REF_NAME#v}"
          muc "$v" > ghi-chu.md
          # Bản thử vX.Y.Z-rc.N không có mục riêng → dùng mục [X.Y.Z]
          if [ ! -s ghi-chu.md ] && [ "$v" != "${v%%-*}" ]; then
            { echo "> Bản thử (release candidate) của ${v%%-*} — chỉ dùng cho staging / UAT."; echo; muc "${v%%-*}"; } > ghi-chu.md
          fi
          grep -q '[^[:space:]]' ghi-chu.md || { echo "CHANGELOG.md chưa có mục [$v] (hoặc [${v%%-*}])"; exit 1; }
      - name: Tạo GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" $pre --title "$GITHUB_REF_NAME" --notes-file ghi-chu.md \
            "vsn-trien-khai-${GITHUB_REF_NAME}.tar.gz"
