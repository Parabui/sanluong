<script>
  const v = n => `var(--${n})`;
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: { DEFAULT: v('brand'), hover: v('brand-hover'), soft: v('brand-soft'), ink: v('brand-ink') },
          rail: { DEFAULT: v('rail'), hover: v('rail-hover'), text: v('rail-text'), line: v('rail-line') },
          canvas: v('canvas'), surface: v('surface'), sunken: v('sunken'),
          line: { DEFAULT: v('line'), strong: v('line-strong') },
          ink: v('ink'), muted: v('muted'), onbrand: v('on-brand'), ondark: v('on-dark'),
          amber: { bg: v('amber-bg'), ink: v('amber-ink'), bar: v('amber-bar') },
          alert: { bg: v('alert-bg'), ink: v('alert-ink'), bar: v('alert-bar') },
          violet: { bg: v('violet-bg'), ink: v('violet-ink'), bar: v('violet-bar') },
          sky: { bg: v('sky-bg'), ink: v('sky-ink') },
          ok: { bg: v('ok-bg'), ink: v('ok-ink'), bar: v('ok-bar') },
          info: { bg: v('info-bg'), ink: v('info-ink') },
          meter: v('meter'), 'meter-track': v('meter-track')

        fontFamily: { sans: v('font'), mono: v('font-mono') },
        borderRadius: { card: v('r-card'), ctl: v('r-ctl') },
        boxShadow: { card: v('shadow-card'), pop: v('shadow-pop') },

<style>
  :root {

    --shadow-card: 0 1px 2px rgba(16,24,40,.05);
    --shadow-pop: 0 12px 32px rgba(16,24,40,.16);
    --overlay: rgba(15,23,32,.4);
    --dur: 150ms;
    --panel-w: 360px; --rail-w: 76px;

  html, body { height: 100%; }
  body { font-family: var(--font); background: var(--canvas); color: var(--ink); font-size: 14px; line-height: 20px; -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2px solid var(--brand-ink); outline-offset: 2px; }

  svg.lucide { stroke-width: 1.75; flex-shrink: 0; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0ms !important; animation: none !important; } }
  .scroll { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }

  .rail-item[aria-current="page"] { background: var(--rail-hover); color: var(--on-dark); }
  .rail-item[aria-current="page"]::before { content: ""; position: absolute; left: -10px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--brand); }

  /* Bảng */
  .tbl { border-collapse: separate; border-spacing: 0; width: 100%; table-layout: fixed; }
  .tbl thead th { position: sticky; top: 0; z-index: 5; background: var(--sunken); height: 36px; box-shadow: inset 0 -1px 0 var(--line); }
  .tbl td { height: 44px; border-bottom: 1px solid var(--line); transition: background-color var(--dur); }
  .tbl tr.grp-start td { border-top: 1px solid var(--line-strong); }
  .tbl tr.grp-start:first-child td { border-top: 0; }
  .tbl tr[data-row] { cursor: pointer; }
  .tbl tr[data-row]:hover td { background: var(--sunken); }
  .tbl tr.st-empty td { background: var(--amber-bg); }
  .tbl tr.st-warn td { background: var(--alert-bg); }
  .tbl tr.st-empty td:first-child { box-shadow: inset 4px 0 0 var(--amber-bar); }
  .tbl tr.st-warn td:first-child { box-shadow: inset 4px 0 0 var(--alert-bar); }
  .tbl tr.st-empty:hover td, .tbl tr.st-warn:hover td { filter: brightness(.985); }
  .tbl tr.is-sel td { background: var(--brand-soft) !important; box-shadow: inset 0 2px 0 var(--brand), inset 0 -2px 0 var(--brand) !important; }
  .tbl tr.is-sel td:first-child { box-shadow: inset 4px 0 0 var(--brand), inset 0 2px 0 var(--brand), inset 0 -2px 0 var(--brand) !important; }
  .tbl tr.is-sel td:last-child { box-shadow: inset -2px 0 0 var(--brand), inset 0 2px 0 var(--brand), inset 0 -2px 0 var(--brand) !important; }
  .tbl tr:focus-visible { outline: 2px solid var(--brand-ink); outline-offset: -2px; }

  .chip-radio input:checked + span { background: var(--ink); color: var(--on-dark); border-color: var(--ink); }
  .chip-radio input:focus-visible + span { outline: 2px solid var(--brand-ink); outline-offset: 2px; }

  .fade { opacity: 0; pointer-events: none; transition: opacity var(--dur); }
  .fade.open { opacity: 1; pointer-events: auto; }
  .overlay { background: var(--overlay); }
  .slide-in { animation: slideIn 180ms ease-out; }
  @keyframes slideIn { from { transform: translateX(12px); opacity: 0; } to { transform: none; opacity: 1; } }
  .tl li::before { content: ""; position: absolute; left: 5px; top: 16px; bottom: -4px; width: 1px; background: var(--line); }
  .tl li:last-child::before { display: none; }

    <p class="text-[12px] text-muted mt-2 text-center">${iss ? `Còn <b class="text-amber-ink">${iss} việc</b> — vẫn chốt được, sẽ có cảnh báo.` : 'Mọi dòng đã có số. Sẵn sàng chốt.'}</p>`;
}

function renderTriage() {
  const d = day();
  const p = $('#panel');
  if (d.status === 'nodata' || d.status === 'off') {
    p.innerHTML = `<div class="p-5">${emptyBox(d.status === 'off' ? 'moon' : 'database', d.status === 'off' ? 'Ngày nghỉ' : 'Chưa có dữ liệu', 'Không có việc cần xử lý.')}</div>`;
    return icons();
  }
  const list = issues(d), tr = timeReqs(d), total = d.rows.length, filled = d.rows.filter(r => r.sl != null).length;
  const pct = total ? Math.round(filled / total * 100) : 0;
  const card = (r) => {
    const empty = r.st === 'empty';
    return `<button data-open="${r.id}" class="w-full text-left rounded-card border ${empty ? 'border-amber-bar/50 bg-amber-bg' : 'border-alert-bar/50 bg-alert-bg'} p-3 flex gap-3 hover:shadow-card hover:border-line-strong transition duration-fast group">
      <span class="w-9 h-9 rounded-ctl bg-surface grid place-items-center shrink-0 ${empty ? 'text-amber-ink' : 'text-alert-ink'}">${ic(empty ? 'circle-dashed' : 'triangle-alert', 'w-[18px] h-[18px]')}</span>
      <span class="flex-1 min-w-0">
        <span class="flex items-center gap-1.5"><span class="text-[12px] font-semibold ${empty ? 'text-amber-ink' : 'text-alert-ink'}">Trạm ${r.tram}</span><span class="text-[12px] text-muted font-mono">${r.cd}</span></span>
        <span class="flex items-center gap-2"><span class="text-[14px] font-semibold truncate">${esc(r.ten)}</span><span class="ml-auto shrink-0 text-[11px] font-semibold uppercase tracking-wide ${empty ? 'text-amber-ink' : 'text-alert-ink'}">${empty ? 'Nhập hộ' : 'Xem lại'}</span></span>
        <span class="block text-[12px] text-ink/80 leading-snug mt-0.5">${empty ? (r.login ? `<b>${esc(r.login.name)}</b> đang đăng nhập trạm` : 'Chưa ai đăng nhập trạm') : `<b class="num">${fmt(r.sl)}</b> sp · ${esc(r.flag)}`}</span>
      </span>
      <span class="self-center text-muted group-hover:text-ink">${ic('chevron-right', 'w-5 h-5 group-hover:translate-x-0.5 transition-transform')}</span>
    </button>`;
  };
  p.innerHTML = `
    <div class="px-5 pt-4 pb-3 border-b border-line shrink-0">
      <div class="flex items-center gap-2"><h2 class="text-[16px] font-semibold">Trước khi chốt</h2><span class="text-[13px] text-muted num">· ${S.line} · ${ddmmyyyy(S.date)}</span></div>
      <div class="mt-3 flex items-end gap-3">
        <div class="text-[30px] leading-none font-semibold num">${filled}<span class="text-[16px] text-muted font-medium">/${total}</span></div>
        <div class="text-[12px] text-muted leading-tight pb-0.5">dòng đã có số<br>${list.length + tr.length ? `<b class="text-amber-ink">còn ${list.length + tr.length} việc cần xử lý</b>` : '<b class="text-ok-ink">không còn việc nào</b>'}</div>
      </div>
      <div class="mt-3 h-2 rounded-full bg-meter-track overflow-hidden flex" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Tỉ lệ dòng đã có số">
        <div class="h-full bg-ok-bar" style="width:${pct}%"></div><div class="h-full bg-amber-bar" style="width:${100 - pct}%"></div>
      </div>
    </div>
    <div class="flex-1 min-h-0 overflow-y-auto scroll px-4 py-4 flex flex-col gap-2.5">
      ${list.length ? `<div class="text-[11px] font-semibold uppercase tracking-wider text-muted px-1">Sản lượng</div>${list.map(card).join('')}` : ''}
      ${tr.length ? `<div class="text-[11px] font-semibold uppercase tracking-wider text-muted px-1 mt-2">Giờ làm</div>` + tr.map(t => `
        <button data-time class="w-full text-left rounded-card border border-line bg-surface p-3 flex gap-3 hover:shadow-card hover:border-line-strong transition duration-fast group">
          <span class="w-9 h-9 rounded-ctl bg-sunken grid place-items-center shrink-0 text-muted">${ic('clock', 'w-[18px] h-[18px]')}</span>
          <span class="flex-1 min-w-0"><span class="block text-[12px] text-muted font-mono">${t.nv}</span><span class="block text-[14px] font-semibold">${esc(t.name)}</span>
          <span class="block text-[12px] text-muted">Xin xác nhận <b class="text-ink num">${t.hours} giờ</b> ngày ${ddmm(S.date)}</span></span>
          <span class="self-center text-[12px] font-semibold flex items-center gap-0.5">Duyệt${ic('chevron-right', 'w-4 h-4 group-hover:translate-x-0.5 transition-transform')}</span>
        </button>`).join('') : ''}
      ${!list.length && !tr.length ? `<div class="flex-1 grid place-items-center text-center"><div><span class="mx-auto w-14 h-14 rounded-full bg-ok-bg text-ok-ink grid place-items-center">${ic('check-check', 'w-7 h-7')}</span>
        <p class="mt-3 font-semibold">Không còn việc cần xử lý</p><p class="text-[13px] text-muted mt-1">Bấm vào một dòng bất kỳ để xem lịch sử hoặc sửa số.</p></div></div>` : ''}
    </div>
    <div class="p-4 border-t border-line shrink-0">${closeFooter(d)}</div>`;
  icons();
}

/* ─── Chi tiết bản ghi (inspector) ─── */
function renderInspector(id) {
  const d = day(), r = row(id); if (!r) return renderTriage();
  const editable = d.status === 'open' || d.status === 'closed';
  const mode = r.st === 'empty' ? 'proxy' : r.st === 'warn' ? 'warn' : 'edit';
  const remaining = issues(d).length + timeReqs(d).length;
  const srcPill = s => s ? `<span class="inline-flex items-center gap-1 h-5 px-1.5 rounded bg-sunken border border-line text-[11px] font-medium">${ic(SRC[s][1], 'w-3 h-3')}${SRC[s][0]}</span>` : '';
  const who = r.name || r.login?.name;
  const banner = r.st === 'warn' ? `<div class="rounded-ctl bg-alert-bg text-alert-ink p-3 text-[13px] flex gap-2">${ic('triangle-alert', 'w-4 h-4 mt-0.5')}<div><b>Cần xem lại:</b> ${esc(r.flag)}. Kiểm tra với công nhân trước khi xác nhận.</div></div>`
    : r.st === 'empty' ? `<div class="rounded-ctl bg-amber-bg text-amber-ink p-3 text-[13px] flex gap-2">${ic('circle-dashed', 'w-4 h-4 mt-0.5')}<div>Trạm chưa có số ngày ${ddmm(S.date)}. ${r.login ? `<b>${esc(r.login.name)}</b> đang đăng nhập trạm — đã điền sẵn.` : 'Chưa ai đăng nhập trạm.'}</div></div>` : '';

  const reasons = REASONS[mode];
  const form = !editable ? '' : `
    <form id="f" class="flex flex-col gap-3" novalidate>
      ${mode === 'proxy' ? `
        <div class="relative">
          <label class="block text-[13px] font-medium mb-1" for="f-nv">Công nhân <span class="text-alert-ink">*</span></label>
          <input id="f-nv" role="combobox" aria-expanded="false" aria-controls="f-list" aria-autocomplete="list" autocomplete="off" value="${r.login ? r.login.nv : ''}" placeholder="Gõ mã NV hoặc tên…"
            class="w-full h-10 px-3 rounded-ctl border border-line-strong bg-surface font-mono text-[14px] uppercase">
          <ul id="f-list" role="listbox" class="hidden absolute left-0 right-0 top-[66px] z-10 bg-surface border border-line rounded-card shadow-pop p-1 max-h-56 overflow-auto"></ul>
          <p id="f-name" class="text-[12px] mt-1 ${r.login ? 'text-ink' : 'text-muted'}">${r.login ? esc(r.login.name) : 'Chọn từ danh sách gợi ý'}</p>
        </div>` : ''}
      <div>
        <label class="block text-[13px] font-medium mb-1" for="f-qty">Số lượng${mode === 'proxy' ? ' <span class="text-alert-ink">*</span>' : ` <span class="text-muted font-normal">· hiện tại <b class="num text-ink">${fmt(r.sl)}</b></span>`}</label>
        <div class="flex items-center gap-2">
          <input id="f-qty" inputmode="numeric" autocomplete="off" value="${mode === 'proxy' ? '' : r.sl}" class="num flex-1 h-12 px-3 rounded-ctl border border-line-strong bg-surface text-[22px] font-semibold text-right">
          <span class="text-[13px] text-muted w-6">sp</span>
        </div>
        <p id="f-diff" class="text-[12px] mt-1 min-h-[16px]"></p>
      </div>
      <fieldset>
        <legend class="text-[13px] font-medium mb-1.5">Lý do <span class="text-alert-ink">*</span> <span class="text-muted font-normal">— lưu vào lịch sử, dùng khi đối chiếu lương</span></legend>
        <div class="flex flex-wrap gap-1.5">${reasons.map((x, i) => `<label class="chip-radio cursor-pointer"><input type="radio" name="reason" value="${x}" class="sr-only">
          <span class="inline-flex items-center h-8 px-3 rounded-full border border-line-strong text-[13px] font-medium hover:bg-sunken transition-colors duration-fast">${x}</span></label>`).join('')}</div>
      </fieldset>
      <div id="f-note-wrap" class="hidden">
        <label class="block text-[13px] font-medium mb-1" for="f-note">Mô tả lý do <span class="text-alert-ink">*</span></label>
        <textarea id="f-note" rows="2" class="w-full px-3 py-2 rounded-ctl border border-line-strong bg-surface text-[14px] resize-none" placeholder="VD: Công nhân chuyển công đoạn giữa ca"></textarea>
      </div>
      <p id="f-err" class="hidden text-[13px] text-alert-ink flex items-center gap-1.5" role="alert"></p>
      <div class="flex gap-2">
        <button type="button" data-back class="h-10 px-4 rounded-ctl border border-line-strong bg-surface hover:bg-sunken text-[14px] font-medium transition-colors duration-fast">Hủy</button>
        <button type="submit" id="f-save" class="flex-1 h-10 rounded-ctl bg-brand hover:bg-brand-hover text-onbrand text-[14px] font-semibold flex items-center justify-center gap-2 transition-colors duration-fast">
          ${ic('save', 'w-4 h-4')}${mode === 'proxy' ? 'Lưu nhập hộ' : mode === 'warn' ? 'Lưu xác nhận' : 'Lưu thay đổi'}</button>
      </div>
      ${remaining ? `<p class="text-[12px] text-muted -mt-1">Sau khi lưu sẽ tự chuyển sang việc tiếp theo.</p>` : ''}
    </form>`;

  $('#panel').innerHTML = `
    <div class="h-12 px-3 flex items-center border-b border-line shrink-0">
      <button data-back class="h-8 pl-1.5 pr-2.5 rounded-ctl flex items-center gap-1 text-[13px] font-medium hover:bg-sunken">${ic('arrow-left', 'w-4 h-4')}Việc cần làm${remaining ? ` <span class="ml-1 h-5 min-w-[20px] px-1.5 rounded-full bg-amber-bg text-amber-ink text-[11px] font-bold grid place-items-center num">${remaining}</span>` : ''}</button>
      <span class="ml-auto text-[12px] text-muted"><kbd class="font-mono px-1 border border-line rounded">Esc</kbd></span>
    </div>
    <div class="flex-1 min-h-0 overflow-y-auto scroll p-5 flex flex-col gap-4 slide-in">
      <div>
        <div class="text-[12px] text-muted"><span class="font-semibold text-ink">Trạm ${r.tram}</span> · <span class="font-mono">${r.cd}</span> · <span class="font-mono">${r.mh}</span> · SMV ${r.smv}s</div>
        <h2 class="text-[18px] font-semibold mt-0.5">${esc(r.ten)}</h2>
        <div class="mt-3 flex items-center gap-3">
          <span class="w-10 h-10 rounded-full ${who ? 'bg-brand-soft text-brand-ink' : 'bg-sunken text-muted'} grid place-items-center text-[13px] font-semibold">${who ? initials(who) : ic('user', 'w-4 h-4')}</span>
          <div class="leading-tight"><div class="font-medium">${who ? esc(who) : 'Chưa ai đăng nhập'}${r.support ? ` <span class="ml-1 h-5 px-1.5 rounded bg-sky-bg text-sky-ink text-[11px] font-semibold inline-flex items-center">Hỗ trợ từ ${r.support}</span>` : ''}</div>
          <div class="text-[12px] text-muted font-mono">${r.nv || r.login?.nv || '—'}${r.st === 'empty' && r.login ? ' <span class="font-sans">· đang đăng nhập</span>' : ''}</div></div>
          ${r.sl != null ? `<div class="ml-auto text-right leading-tight"><div class="text-[22px] font-semibold num">${fmt(r.sl)}</div><div class="text-[11px] text-muted">${minutes(r)} phút chuẩn</div></div>` : ''}
        </div>
      </div>
      ${banner}
      ${form}
      <section>
        <h3 class="text-[13px] font-semibold mb-2 flex items-center gap-1.5">${ic('history', 'w-4 h-4 text-muted')}Lịch sử thay đổi</h3>
        ${r.hist.length ? `<ol class="tl">${r.hist.map((h, i) => `<li class="relative pl-6 pb-4">
          <span class="absolute left-0 top-1 w-[11px] h-[11px] rounded-full border-2 ${i === 0 ? 'border-brand bg-brand-soft' : 'border-line-strong bg-surface'}"></span>
          <div class="flex items-center gap-2"><span class="num text-[15px] font-semibold">${h.from == null ? fmt(h.to) : `${fmt(h.from)} <span class="text-muted">→</span> ${fmt(h.to)}`}</span>${srcPill(h.src)}<span class="ml-auto text-[12px] text-muted num">${h.t}</span></div>
          <div class="text-[13px] mt-0.5">${esc(h.by)}${h.reason ? ` <span class="text-muted">—</span> ${esc(h.reason)}` : ''}</div></li>`).join('')}</ol>`
          : '<p class="text-[13px] text-muted">Chưa có bản ghi nào.</p>'}
      </section>
    </div>`;
  icons();
  if (editable) wireForm(r, mode);
}

function parseQty(v) {
  v = String(v).trim();
  if (/^\d{1,3}(\.\d{3})+$/.test(v)) v = v.replace(/\./g, '');
  if (!/^\d+$/.test(v)) return null;
  const n = +v; return n <= 99999 ? n : null;
}
function wireForm(r, mode) {
  const f = $('#f'), qty = $('#f-qty'), diff = $('#f-diff'), err = $('#f-err'), noteWrap = $('#f-note-wrap'), note = $('#f-note');
  const showErr = (m, el) => { err.innerHTML = ic('circle-alert', 'w-4 h-4') + esc(m); err.classList.remove('hidden'); icons(); el?.focus(); el?.classList.add('border-alert-bar'); };
  const clear = () => { err.classList.add('hidden'); $$('.border-alert-bar', f).forEach(x => x.classList.remove('border-alert-bar')); };
  const upd = () => {
    clear();
    const n = parseQty(qty.value);
    if (qty.value.trim() && n == null) { diff.className = 'text-[12px] mt-1 min-h-[16px] text-alert-ink'; diff.textContent = 'Số lượng phải là số nguyên từ 0 đến 99.999'; return; }
    if (mode === 'proxy' || n == null || n === r.sl) { diff.textContent = ''; return; }
    const dlt = n - r.sl;
    diff.className = 'text-[12px] mt-1 min-h-[16px] font-medium ' + (dlt < 0 ? 'text-alert-ink' : 'text-ok-ink');
    diff.innerHTML = `${fmt(r.sl)} → ${fmt(n)} (${dlt > 0 ? '+' : '−'}${fmt(Math.abs(dlt))})${dlt < 0 ? ' · Số mới nhỏ hơn số cũ' : ''}`;
  };
  qty.addEventListener('input', upd);
  f.addEventListener('change', e => { if (e.target.name === 'reason') { noteWrap.classList.toggle('hidden', e.target.value !== 'Khác'); clear(); if (e.target.value === 'Khác') note.focus(); } });

  if (mode === 'proxy') {
    const nv = $('#f-nv'), list = $('#f-list'), name = $('#f-name');
    let hi = -1, m = [];
    const close = () => { list.classList.add('hidden'); nv.setAttribute('aria-expanded', 'false'); hi = -1; };
    const pick = e => { nv.value = e.nv; name.className = 'text-[12px] mt-1 text-ink'; name.textContent = e.name; close(); qty.focus(); };
    const draw = () => {
      const q = nv.value.trim().toUpperCase();
      m = q ? EMP.filter(e => e.nv.startsWith(q) || e.name.toUpperCase().includes(q)).slice(0, 6) : [];
      if (!m.length) return close();
      list.innerHTML = m.map((e, i) => `<li role="option" id="fo${i}" aria-selected="${i === hi}" data-i="${i}" class="h-10 px-2 flex items-center gap-2.5 rounded-ctl cursor-pointer ${i === hi ? 'bg-brand-soft' : 'hover:bg-sunken'}">
        <span class="w-7 h-7 rounded-full bg-sunken grid place-items-center text-[11px] font-semibold">${initials(e.name)}</span><span class="text-[14px]">${esc(e.name)}</span><span class="ml-auto font-mono text-[12px] text-muted">${e.nv}</span></li>`).join('');
      list.classList.remove('hidden'); nv.setAttribute('aria-expanded', 'true'); nv.setAttribute('aria-activedescendant', hi >= 0 ? 'fo' + hi : '');
    };
    nv.addEventListener('input', () => { hi = -1; draw(); const ex = EMP.find(e => e.nv === nv.value.trim().toUpperCase()); name.className = 'text-[12px] mt-1 ' + (ex ? 'text-ink' : 'text-muted'); name.textContent = ex ? ex.name : 'Chọn từ danh sách gợi ý'; });
    nv.addEventListener('keydown', e => {
      if (list.classList.contains('hidden')) return;
      if (e.key === 'ArrowDown') { e.preventDefault(); hi = (hi + 1) % m.length; draw(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); hi = (hi - 1 + m.length) % m.length; draw(); }
      else if (e.key === 'Enter' && hi >= 0) { e.preventDefault(); pick(m[hi]); }
      else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); }
    });
    list.addEventListener('mousedown', e => { const li = e.target.closest('[data-i]'); if (li) { e.preventDefault(); pick(m[+li.dataset.i]); } });
    nv.addEventListener('blur', () => setTimeout(close, 120));
  }

  f.addEventListener('submit', e => {
    e.preventDefault(); clear();
    let emp = null;
    if (mode === 'proxy') { emp = EMP.find(x => x.nv === $('#f-nv').value.trim().toUpperCase()); if (!emp) return showErr('Chọn công nhân từ danh sách gợi ý.', $('#f-nv')); }
    const n = parseQty(qty.value);
    if (n == null) return showErr('Số lượng phải là số nguyên từ 0 đến 99.999', qty);
    const rs = f.reason.value;
    if (mode === 'edit' && n === r.sl) return showErr('Số lượng chưa thay đổi.', qty);
    if (mode === 'warn' && n === r.sl && rs && rs !== 'Đã kiểm tra, số đúng' && rs !== 'Khác') return showErr('Số chưa đổi — chọn “Đã kiểm tra, số đúng” nếu giữ nguyên.', qty);
    if (!rs) return showErr('Chọn lý do trước khi lưu.', f.querySelector('input[name=reason]'));
    if (rs === 'Khác' && !note.value.trim()) return showErr('Mô tả lý do khi chọn “Khác”.', note);
    const reason = rs === 'Khác' ? note.value.trim() : rs;
    if (mode === 'proxy') {
      r.hist.unshift({ t: stamp(), from: null, to: n, src: 'proxy', by: USER, reason });
      Object.assign(r, { nv: emp.nv, name: emp.name, sl: n, src: 'proxy', st: 'adjusted', login: null });
    } else {
      r.hist.unshift({ t: stamp(), from: r.sl, to: n, src: 'web', by: USER, reason });
      Object.assign(r, { sl: n, src: n === r.sl ? r.src : 'web', st: 'adjusted', flag: null });
    }
    const next = issues(day())[0];
    toast(`Đã lưu · Trạm ${r.tram}${next ? ` — tiếp: Trạm ${next.tram}` : ''}`);
    select(next ? next.id : null);
  });
  (mode === 'proxy' && !r.login ? $('#f-nv') : qty).focus();
  qty.select?.();
}

/* ════════ Điều phối ════════ */
function renderPanel() { S.sel ? renderInspector(S.sel) : renderTriage(); }
function render() { renderPending(); renderContext(); renderFilters(); renderData(); renderPanel(); icons(); }
function select(id, focusRow = false) {
  S.sel = id; renderData(); renderPanel(); renderFilters(); renderContext(); renderPending(); icons();
  if (id) $(`#data [data-row="${id}"]`)?.scrollIntoView({ block: 'nearest' });
  if (focusRow && id) $(`#data [data-row="${id}"]`)?.focus();
}
function goto(line, date) { S.line = line; S.date = date; S.sel = null; S.filter = 'all'; render(); }

/* ════════ Chốt ngày ════════ */
let lastFocus = null;
function openClose() {
  const d = day(), list = issues(d), tr = timeReqs(d), empty = list.filter(r => r.st === 'empty').length, warn = list.length - empty;
  const n = list.length + tr.length;
  lastFocus = document.activeElement;
  $('#modal').innerHTML = `
    <div class="p-6">
      <div class="flex items-start gap-3">
        <span class="w-10 h-10 rounded-full ${n ? 'bg-amber-bg text-amber-ink' : 'bg-ok-bg text-ok-ink'} grid place-items-center shrink-0">${ic(n ? 'triangle-alert' : 'circle-check', 'w-5 h-5')}</span>
        <div><h2 id="modal-title" class="text-[18px] font-semibold">Chốt ngày ${ddmmyyyy(S.date)} – ${S.line}?</h2>
        <p class="text-[14px] text-muted mt-1">Sau khi chốt, công nhân không nhập được số của ngày này. Tổ trưởng vẫn sửa được (bắt buộc lý do).</p></div>
      </div>
      ${n ? `<ul class="mt-4 rounded-card border border-line divide-y divide-line">
        ${empty ? `<li class="px-3 py-2.5 flex items-center gap-2.5 text-[14px]">${ic('circle-dashed', 'w-4 h-4 text-amber-ink')}<span>Còn <b class="num">${empty}</b> ô chưa có số</span><button data-fix="empty" class="ml-auto text-[13px] font-semibold text-brand-ink hover:underline">Xử lý ngay</button></li>` : ''}
        ${warn ? `<li class="px-3 py-2.5 flex items-center gap-2.5 text-[14px]">${ic('triangle-alert', 'w-4 h-4 text-alert-ink')}<span>Còn <b class="num">${warn}</b> ô cần xem lại</span><button data-fix="warn" class="ml-auto text-[13px] font-semibold text-brand-ink hover:underline">Xử lý ngay</button></li>` : ''}
        ${tr.length ? `<li class="px-3 py-2.5 flex items-center gap-2.5 text-[14px]">${ic('clock', 'w-4 h-4 text-muted')}<span>Còn <b class="num">${tr.length}</b> yêu cầu giờ chờ duyệt</span></li>` : ''}
      </ul>
      <label class="mt-4 flex items-start gap-2.5 text-[14px] cursor-pointer"><input id="ack" type="checkbox" class="mt-0.5 w-4 h-4 accent-[var(--ink)]">
        <span>Tôi đã kiểm tra và vẫn muốn chốt khi còn <b>${n} việc</b> chưa xử lý.</span></label>` : ''}
    </div>
    <div class="px-6 pb-6 flex justify-end gap-2">
      <button id="m-cancel" class="h-10 px-4 rounded-ctl border border-line-strong bg-surface hover:bg-sunken text-[14px] font-medium">Để sau</button>
      <button id="m-ok" class="h-10 px-4 rounded-ctl bg-brand hover:bg-brand-hover text-onbrand text-[14px] font-semibold flex items-center gap-2 disabled:bg-sunken disabled:text-muted disabled:cursor-not-allowed" ${n ? 'disabled' : ''}>${ic('circle-check', 'w-4 h-4')}${n ? 'Vẫn chốt ngày' : 'Chốt ngày'}</button>
    </div>`;
  icons();
  $('#modal-wrap').classList.add('open');
  $('#ack')?.addEventListener('change', e => $('#m-ok').disabled = !e.target.checked);
  $('#m-cancel').onclick = () => closeModal();
  $('#m-ok').onclick = () => {
    Object.assign(d, { status: 'closed', closedBy: USER, closedAt: `${NOW.time} ${ddmmyyyy(NOW.date)}` });
    closeModal(false); S.sel = null; render(); toast(`Đã chốt ngày ${ddmmyyyy(S.date)} – ${S.line}`);
  };
  $$('[data-fix]', $('#modal')).forEach(b => b.onclick = () => { const t = issues(d).find(r => r.st === b.dataset.fix); closeModal(false); if (t) select(t.id); });
  setTimeout(() => ($('#ack') || $('#m-ok')).focus(), 30);
}
function closeModal(restore = true) { $('#modal-wrap').classList.remove('open'); if (restore) lastFocus?.focus(); }
$('#modal-wrap').addEventListener('mousedown', e => { if (e.target.id === 'modal-wrap') closeModal(); });
$('#modal-wrap').addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.stopPropagation(); closeModal(); }
  if (e.key === 'Tab') { const f = $$('button:not([disabled]),input', $('#modal')); const i = f.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); } }
});

/* ════════ Toast & tooltip ════════ */
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'h-11 pl-3 pr-4 rounded-full bg-rail text-ondark text-[13px] font-medium flex items-center gap-2 shadow-pop slide-in';
  t.innerHTML = `<span class="w-6 h-6 rounded-full bg-ok-bar grid place-items-center">${ic('check', 'w-3.5 h-3.5')}</span>${esc(msg)}`;
  $('#toasts').appendChild(t); icons(); setTimeout(() => t.remove(), 3000);
}
const tip = $('#tip');
function showTip(el) {
  tip.textContent = el.dataset.tip; tip.classList.remove('hidden');
  const a = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(Math.max(8, a.left + a.width / 2 - w / 2), innerWidth - w - 8) + 'px';
  tip.style.top = (a.top - h - 6 < 8 ? a.bottom + 6 : a.top - h - 6) + 'px';
}
const hideTip = () => tip.classList.add('hidden');
document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); el ? showTip(el) : hideTip(); });
document.addEventListener('scroll', hideTip, true);

/* ════════ Sự kiện ════════ */
function toggleMenu(btn, menu, force) { const open = force ?? menu.classList.contains('hidden'); menu.classList.toggle('hidden', !open); btn.setAttribute('aria-expanded', String(open)); if (open) menu.querySelector('[role=menuitem]')?.focus(); }
$('#btn-pending').onclick = e => { e.stopPropagation(); toggleMenu($('#btn-pending'), $('#menu-pending')); toggleMenu($('#btn-user'), $('#menu-user'), false); };
$('#btn-user').onclick = e => { e.stopPropagation(); toggleMenu($('#btn-user'), $('#menu-user')); toggleMenu($('#btn-pending'), $('#menu-pending'), false); };
$('#btn-cal').onclick = () => { try { $('#date-native').showPicker(); } catch { $('#date-native').click(); } };
$('#date-native').onchange = e => DATES.includes(e.target.value) && goto(S.line, e.target.value);
$('#search').addEventListener('input', e => { S.q = e.target.value; renderData(); icons(); });
$('#btn-shortcuts').onclick = () => toast('Phím tắt: / tìm · ↑↓ chọn dòng · Enter mở · N việc tiếp theo · Esc đóng');

document.addEventListener('click', e => {
  const t = e.target;
  if (!t.closest('#menu-pending,#btn-pending')) toggleMenu($('#btn-pending'), $('#menu-pending'), false);
  if (!t.closest('#menu-user,#btn-user')) toggleMenu($('#btn-user'), $('#menu-user'), false);
  let el;
  if ((el = t.closest('[data-go]'))) { const [l, d] = el.dataset.go.split('|'); toggleMenu($('#btn-pending'), $('#menu-pending'), false); return goto(l, d); }
  if ((el = t.closest('[data-line]'))) return goto(el.dataset.line, S.date);
  if ((el = t.closest('[data-date]'))) return goto(S.line, el.dataset.date);
  if ((el = t.closest('[data-view]'))) { S.view = el.dataset.view; renderFilters(); renderData(); return icons(); }
  if ((el = t.closest('[data-filter]'))) { S.filter = el.dataset.filter; renderFilters(); renderData(); return icons(); }
  if ((el = t.closest('#data [data-row]'))) return select(el.dataset.row);
  if ((el = t.closest('[data-open]'))) return select(el.dataset.open);
  if (t.closest('[data-back]')) { const id = S.sel; select(null); return id && $(`#data [data-row="${id}"]`)?.focus(); }
  if (t.closest('#btn-close')) return openClose();
  if (t.closest('[data-time]')) { S.timeDone = true; toast('Đã duyệt 10,5 giờ · Bùi Thị Hạnh (demo)'); return render(); }
  if ((el = t.closest('[data-nav]'))) { e.preventDefault(); if (!el.hasAttribute('aria-current')) toast(`“${el.dataset.nav}” — ngoài phạm vi demo`); return; }
  if ((el = t.closest('[data-demo]'))) { toggleMenu($('#btn-user'), $('#menu-user'), false); return toast(`${el.dataset.demo} — ngoài phạm vi demo`); }
});

document.addEventListener('keydown', e => {
  const typing = e.target.matches('input,textarea,select');
  if (e.key === 'Escape') {
    if (!$('#menu-pending').classList.contains('hidden') || !$('#menu-user').classList.contains('hidden')) { toggleMenu($('#btn-pending'), $('#menu-pending'), false); toggleMenu($('#btn-user'), $('#menu-user'), false); return; }
    if (S.sel) { const id = S.sel; select(null); $(`#data [data-row="${id}"]`)?.focus(); return; }
    if (e.target.id === 'search' && S.q) { e.target.value = ''; S.q = ''; renderData(); icons(); }
    return;
  }
  if (typing) return;
  if (e.key === '/') { e.preventDefault(); $('#search').focus(); return; }
  if (e.key.toLowerCase() === 'n' && !e.ctrlKey && !e.metaKey) { const n = issues(day())[0]; if (n) select(n.id); return; }
  const tr = e.target.closest?.('#data [data-row]');
  if (tr && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    e.preventDefault(); const all = $$('#data [data-row]'); const i = all.indexOf(tr);
    all[Math.max(0, Math.min(all.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))]?.focus();
  }
  if (tr && e.key === 'Enter' && tr.tagName === 'TR') { e.preventDefault(); select(tr.dataset.row); }
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && e.target.closest('[role=menu]')) {
    e.preventDefault(); const items = $$('[role=menuitem]', e.target.closest('[role=menu]')); const i = items.indexOf(e.target);
    items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus();
  }
});

renderRail();
render();
</script>
</body>
</html>
